<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Tracker — Sign In</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-size: 13px;
    }
    .card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 2rem;
      width: 280px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #111;
    }
    .subtitle {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 500;
      color: #444;
      margin-bottom: 0.3rem;
    }
    input[type=password] {
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 0.35rem 0.5rem;
      font-family: inherit;
      font-size: 13px;
      color: #111;
      background: #fff;
      margin-bottom: 1rem;
    }
    input[type=password]:focus { outline: none; border-color: #2563eb; }
    button {
      width: 100%;
      padding: 0.4rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: default; }
    .error {
      color: #dc2626;
      font-size: 0.72rem;
      margin-bottom: 0.75rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Portfolio Tracker</h1>
    <p class="subtitle">Local network access</p>
    <div class="error" id="error">Incorrect password. Try again.</div>
    <label for="password">Password</label>
    <input type="password" id="password" autofocus placeholder="Enter password" />
    <button id="btn" onclick="login()">Sign In</button>
  </div>
  <script>
    const input = document.getElementById('password');
    const btn = document.getElementById('btn');
    const errorEl = document.getElementById('error');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    async function login() {
      const password = input.value;
      if (!password) return;
      errorEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          window.location.href = params.get('redirect') || '/';
        } else {
          errorEl.style.display = 'block';
          input.value = '';
          input.focus();
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      } catch {
        errorEl.textContent = 'Connection error. Try again.';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }
  </script>
</body>
</html>
