      // ── AI STRATEGY ─────────────────────────────────────────────────
      // Compute initial strategyEdits that scale existing weights to 100% when all suggestions are OFF
      const computeSuggestionInitEdits = (suggestions) => {
        const edits = {};
        (suggestions.accounts || []).forEach(acct => {
          const existing = (acct.targets || []).filter(t => !t.new);
          const suggested = (acct.targets || []).filter(t => t.new);
          if (!suggested.length) return;
          const existingTotal = existing.reduce((s, t) => s + t.targetWeight, 0) + (acct.cashTargetWeight ?? 0);
          if (existingTotal === 0) return;
          // Scale each existing weight so they collectively sum to 100%
          const newTargets = {};
          let distributed = 0;
          existing.forEach((t, i) => {
            if (i === existing.length - 1 && acct.cashTargetWeight == null) {
              newTargets[t.ticker] = 100 - distributed;
            } else {
              newTargets[t.ticker] = Math.round(t.targetWeight / existingTotal * 100);
              distributed += newTargets[t.ticker];
            }
          });
          let cashVal = null;
          if (acct.cashTargetWeight != null) {
            const tDist = existing.reduce((s, t) => s + newTargets[t.ticker], 0);
            cashVal = 100 - tDist;
          }
          edits[acct.accountName] = { targets: newTargets, cash: cashVal };
        });
        return edits;
      };

      const getAIStrategy = async () => {
        if (strategyState && strategyState.data) {
          if (!confirm('This will replace the existing strategy. Continue?')) return;
        }
        setStrategyState({ loading: true });
        setStrategyApproved(false);
        setStrategyPanelOpen(true);
        try {
          const resp = await fetch('/api/rebalance-strategy', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config, instructions: config.strategyGoals || '' })
          });
          const text = await resp.text();
          if (!resp.ok) throw new Error(text);
          const { suggestions } = JSON.parse(text);
          setStrategyLocks({});
          setStrategyIncluded({});
          setStrategyState({ data: suggestions });
          updateConfig('strategyResult', suggestions);
          // Redistribute suggestion weights back to existing so total = 100% with all suggestions OFF
          const initEdits = computeSuggestionInitEdits(suggestions);
          setStrategyEdits(initEdits);
        } catch (err) {
          setStrategyState({ error: err.message });
        }
      };

      const applyStrategy = (suggestions) => {
        if (!confirm('Apply AI strategy? This will overwrite target weights and triggers for all accounts.')) return;
        const sameLength = suggestions.accounts.length === config.accounts.length;
        const newAccounts = config.accounts.map((account, accIdx) => {
          const nameMatch = suggestions.accounts.find(a =>
            a.accountName === account.name ||
            a.accountName.toLowerCase().includes(account.name.toLowerCase()) ||
            account.name.toLowerCase().includes(a.accountName.toLowerCase())
          );
          const acctSugg = nameMatch || (sameLength ? suggestions.accounts[accIdx] : null);
          if (!acctSugg) return account;
          const normTicker = (t) => t.toUpperCase().replace(/\.(TO|NE|V|TSX)$/i, '');
          const newStocks = account.stocks.map(stock => {
            const match = acctSugg.targets.find(t =>
              t.ticker === stock.ticker || normTicker(t.ticker) === normTicker(stock.ticker)
            );
            const updated = { ...stock };
            if (match) {
              updated.targetWeight = match.targetWeight;
              if (match.weightTriggerAbove != null) updated.weightTriggerAbove = match.weightTriggerAbove;
              else delete updated.weightTriggerAbove;
              if (match.weightTriggerBelow != null) updated.weightTriggerBelow = match.weightTriggerBelow;
              else delete updated.weightTriggerBelow;
              if (match.priceTriggerAbove != null) updated.priceTriggerAbove = match.priceTriggerAbove;
              else delete updated.priceTriggerAbove;
              if (match.priceTriggerBelow != null) updated.priceTriggerBelow = match.priceTriggerBelow;
              else delete updated.priceTriggerBelow;
            } else {
              delete updated.targetWeight;
            }
            return updated;
          });
          // Add included suggestions as new holdings
          const includedForAcct = strategyIncluded[account.name] || {};
          (acctSugg.targets || []).filter(t => t.new && includedForAcct[t.ticker] && !newStocks.some(s => s.ticker === t.ticker)).forEach(t => {
            const h = { ticker: t.ticker, shares: 0, targetWeight: t.targetWeight };
            if (t.weightTriggerAbove != null) h.weightTriggerAbove = t.weightTriggerAbove;
            if (t.weightTriggerBelow != null) h.weightTriggerBelow = t.weightTriggerBelow;
            if (t.priceTriggerAbove != null) h.priceTriggerAbove = t.priceTriggerAbove;
            if (t.priceTriggerBelow != null) h.priceTriggerBelow = t.priceTriggerBelow;
            newStocks.push(h);
          });
          return { ...account, stocks: newStocks };
        });
        updateConfig('accounts', newAccounts);
        // Auto-run rebalance with the freshly applied config (bypass stale closure)
        const updatedConfig = { ...config, accounts: newAccounts };
        setRebalanceState({});
        newAccounts.forEach((_, accIdx) => analyzeRebalance(accIdx, updatedConfig));
      };

      const addSuggestedHolding = (accountName, target, existingPool, existingOrigWeights) => {
        // 1. Add to account config
        setConfig(prev => {
          const c = JSON.parse(JSON.stringify(prev));
          const accIdx = c.accounts.findIndex(a => a.name === accountName);
          if (accIdx === -1) return prev;
          const h = { ticker: target.ticker, shares: 0, targetWeight: target.targetWeight };
          if (target.weightTriggerAbove != null) h.weightTriggerAbove = target.weightTriggerAbove;
          if (target.weightTriggerBelow != null) h.weightTriggerBelow = target.weightTriggerBelow;
          if (target.priceTriggerAbove != null) h.priceTriggerAbove = target.priceTriggerAbove;
          if (target.priceTriggerBelow != null) h.priceTriggerBelow = target.priceTriggerBelow;
          c.accounts[accIdx].stocks.push(h);
          return c;
        });
        // 2. Move from suggested → existing in strategy state (remove new: true)
        setStrategyState(prev => {
          if (!prev?.data) return prev;
          const newData = { ...prev.data, accounts: prev.data.accounts.map(acct => {
            if (acct.accountName !== accountName) return acct;
            return { ...acct, targets: acct.targets.map(t =>
              t.ticker === target.ticker ? { ...t, new: false } : t
            )};
          })};
          return { ...prev, data: newData };
        });
        // 3. Redistribute existing weights to absorb the new allocation
        const newPool = [...existingPool, target.ticker];
        const newOrigWeights = { ...existingOrigWeights, [target.ticker]: 0 };
        redistributeWeight(accountName, target.ticker, target.targetWeight, newPool, newOrigWeights);
      };

      // ── STRATEGY TWEAK HELPERS ───────────────────────────────────────
      const getEffectiveWeight = (acctName, ticker, originalWeight) => {
        const e = strategyEdits[acctName];
        if (!e) return originalWeight;
        if (ticker === '__cash__') return e.cash != null ? e.cash : originalWeight;
        return e.targets?.[ticker] != null ? e.targets[ticker] : originalWeight;
      };

      const setEditedWeight = (acctName, ticker, value) => {
        setStrategyEdits(prev => {
          const acct = prev[acctName] || { targets: {}, cash: null };
          if (ticker === '__cash__') return { ...prev, [acctName]: { ...acct, cash: value } };
          return { ...prev, [acctName]: { ...acct, targets: { ...acct.targets, [ticker]: value } } };
        });
      };

      const redistributeWeight = (acctName, changedTicker, newWeight, allTickers, originalWeights) => {
        const e = strategyEdits[acctName] || {};
        const cur = {};
        allTickers.forEach(tk => {
          if (tk === '__cash__') cur[tk] = e.cash != null ? e.cash : (originalWeights[tk] ?? 0);
          else cur[tk] = e.targets?.[tk] != null ? e.targets[tk] : (originalWeights[tk] ?? 0);
        });
        const delta = newWeight - (cur[changedTicker] ?? 0);
        if (delta === 0) return;
        const locks = strategyLocks[acctName] || {};
        const absorbers = allTickers.filter(tk => tk !== changedTicker && !locks[tk]);
        const absorberSum = absorbers.reduce((s, tk) => s + (cur[tk] ?? 0), 0);
        setStrategyEdits(prev => {
          const acct = prev[acctName] || { targets: {}, cash: null };
          const newTargets = { ...(acct.targets || {}) };
          let newCash = acct.cash != null ? acct.cash : null;
          if (changedTicker === '__cash__') newCash = Math.max(0, Math.round(newWeight * 10) / 10);
          else newTargets[changedTicker] = Math.max(0, Math.round(newWeight * 10) / 10);
          const newVals = {};
          if (absorberSum > 0) {
            absorbers.forEach(tk => {
              newVals[tk] = Math.max(0, Math.round((cur[tk] - delta * (cur[tk] / absorberSum)) * 10) / 10);
              if (tk === '__cash__') newCash = newVals[tk];
              else newTargets[tk] = newVals[tk];
            });
            // Reconcile rounding residual so total stays exactly 100%
            const changedVal = changedTicker === '__cash__' ? newCash : (newTargets[changedTicker] ?? 0);
            const lockedSum = allTickers.filter(tk => locks[tk] && tk !== changedTicker).reduce((s, tk) => s + (cur[tk] ?? 0), 0);
            const absorberTotal = absorbers.reduce((s, tk) => s + (newVals[tk] ?? 0), 0);
            const residual = Math.round((100 - changedVal - lockedSum - absorberTotal) * 10) / 10;
            if (residual !== 0) {
              const largest = absorbers.reduce((best, tk) => (newVals[tk] ?? 0) > (newVals[best] ?? 0) ? tk : best, absorbers[0]);
              const corrected = Math.max(0, Math.round((newVals[largest] + residual) * 10) / 10);
              if (largest === '__cash__') newCash = corrected;
              else newTargets[largest] = corrected;
            }
          }
          return { ...prev, [acctName]: { targets: newTargets, cash: newCash } };
        });
      };

      const adjustTargetWeight = (accIdx, stockIdx, delta) => {
        setConfig(prev => {
          const c = JSON.parse(JSON.stringify(prev));
          const stocks = c.accounts[accIdx].stocks;
          const changed = stocks[stockIdx];
          if (changed.targetWeight == null) return prev;
          const newWeight = Math.max(0, Math.round((changed.targetWeight + delta) * 10) / 10);
          const actualDelta = newWeight - changed.targetWeight;
          if (actualDelta === 0) return prev;
          changed.targetWeight = newWeight;
          const absorbers = stocks.filter((s, i) => i !== stockIdx && s.targetWeight != null);
          const absorberSum = absorbers.reduce((sum, s) => sum + s.targetWeight, 0);
          if (absorberSum > 0) {
            const newVals = absorbers.map(s => Math.max(0, Math.round((s.targetWeight - actualDelta * (s.targetWeight / absorberSum)) * 10) / 10));
            newVals.forEach((v, i) => { absorbers[i].targetWeight = v; });
            const residual = Math.round((Math.round((absorberSum - actualDelta) * 10) / 10 - newVals.reduce((s, v) => s + v, 0)) * 10) / 10;
            if (residual !== 0) {
              const li = newVals.indexOf(Math.max(...newVals));
              absorbers[li].targetWeight = Math.max(0, Math.round((newVals[li] + residual) * 10) / 10);
            }
          }
          return c;
        });
      };

      const analyzeRebalance = async (accIdx, configOverride = null) => {
        setRebalanceState(prev => ({ ...prev, [accIdx]: { ...prev[accIdx], loading: true } }));
        const cfg = configOverride || config;
        const filename = currentFilename || cfg.reportName.toLowerCase().replace(/[^a-z0-9]/g, '-') + '.json';
        try {
          const resp = await fetch(`/api/reports/${filename}/holdings`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ config: cfg })
          });
          if (!resp.ok) throw new Error('Server error');
          const reportData = await resp.json();
          const accountData = reportData.accounts[accIdx];
          const rebalance = accountData?.rebalance || null;
          setRebalanceState(prev => ({ ...prev, [accIdx]: { data: rebalance, holdings: accountData?.holdings, accountTotal: accountData?.total } }));
        } catch (err) {
          setRebalanceState(prev => ({ ...prev, [accIdx]: { error: err.message } }));
        }
      };

      // ── TOP BAR (always visible) ─────────────────────────────────────
      const topBar = (
        <div className="top-bar">
          <div style={{display: 'flex', alignItems: 'center', gap: '0.6rem'}}>
            {config && <button className="btn btn-secondary" title="Back to portfolio list" onClick={() => { if (!isDirty || confirm('You have unsaved changes. Go back without saving?')) { setConfig(null); setCurrentFilename(null); setIsDirty(false); setEditorTab('portfolio'); } }}>🏠</button>}
            <h1>Portfolio Config Editor</h1>
            {config && (
              isRenamingReport ? (
                <span style={{display: 'flex', alignItems: 'center', gap: '0.3rem'}}>
                  <input
                    type="text"
                    value={renameValue}
                    autoFocus
                    onChange={(e) => setRenameValue(e.target.value)}
                    onKeyDown={(e) => { if (e.key === 'Enter') submitRename(); if (e.key === 'Escape') cancelRename(); }}
                    style={{fontSize: '0.75rem', padding: '0.2rem 0.4rem', width: '160px'}}
                  />
                  <button className="btn btn-primary btn-sm" onClick={submitRename} title="Save name">✓</button>
                  <button className="btn btn-secondary btn-sm" onClick={cancelRename} title="Cancel">✕</button>
                </span>
              ) : (
                <span style={{fontSize: '0.75rem', color: '#888', display: 'flex', alignItems: 'center', gap: '0.3rem'}}>
                  {config.reportName.toLowerCase().replace(/[^a-z0-9]/g, '-')}.json
                  <span style={{cursor: 'pointer'}} onClick={startRename} title="Rename this report">✏️</span>
                </span>
              )
            )}
          </div>
          <div className="top-bar-actions">
            {!config && <button className="btn btn-secondary" onClick={newConfig}>New</button>}
            {!config && <button className="btn btn-secondary" onClick={loadJSON}>Open</button>}
            {config && <button className="btn btn-secondary" title="Refresh prices &amp; rebalance data" onClick={() => { setRebalanceState({}); config.accounts.forEach((_, i) => analyzeRebalance(i)); }}>↻ Refresh</button>}
            {config && <button className="btn btn-primary" onClick={() => saveJSON()} style={isDirty ? {background: '#d97706', borderColor: '#d97706'} : {}}>{isDirty ? 'Save *' : 'Save'}</button>}
            {saveToast && <span style={{fontSize: '0.75rem', color: '#16a34a', fontWeight: 500}}>{saveToast}</span>}
          </div>
        </div>
      );

      // ── EMPTY STATE ──────────────────────────────────────────────────
      if (!config) {
        return (
          <div className="app">
            {topBar}
            <div className="empty-state">
              {reportsError ? (
                <div>
                  <p style={{color: '#dc2626', marginBottom: '0.75rem', fontWeight: 500}}>⚠ {reportsError}</p>
                  <p style={{marginBottom: '0.75rem', fontSize: '0.85rem', color: '#666'}}>You can still create a new report or open a JSON file:</p>
                  <div className="row" style={{marginTop: '0.5rem', justifyContent: 'center'}}>
                    <button className="btn btn-primary" onClick={newConfig}>New Report</button>
                    <button className="btn btn-secondary" onClick={loadJSON}>Open JSON</button>
                    <button className="btn btn-secondary" onClick={() => { setReportsError(null); window.location.reload(); }}>Retry</button>
                  </div>
                </div>
              ) : savedReports.length > 0 ? (
                <div>
                  <p style={{marginBottom: '0.75rem'}}>Select a report to edit:</p>
                  <div style={{display: 'flex', flexDirection: 'column', gap: '0.3rem', alignItems: 'center'}}>
                    {savedReports.map(f => {
                      const isPreviewing = quickPreviewingFile === f || (chartsLoading && chartsFile === f);
                      return (
                        <div key={f} style={{display: 'flex', gap: '0.4rem', alignItems: 'center', height: '2.2rem'}}>
                          <button className="btn btn-secondary btn-preview-tall" style={{width: '200px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontSize: '0.85rem', fontWeight: 600}} onClick={() => loadFromServer(f)} title="Edit this report">
                            <span>{f.replace('.json', '')}</span>
                            <span aria-hidden="true">✏️</span>
                          </button>
                          <button className="btn btn-primary btn-preview-tall" onClick={() => { quickPreviewReport(f); loadCharts(f); }} disabled={isPreviewing} title="Preview this report (summary + charts)">
                            {isPreviewing ? 'Fetching…' : 'Preview'}
                          </button>
                        </div>
                      );
                    })}
                  </div>
                  {quickPreviewResult && (
                    <div style={{marginTop: '1.25rem', textAlign: 'left', maxWidth: '420px', margin: '1.25rem auto 0'}}>
                      <div style={{fontSize: '0.7rem', color: '#888', marginBottom: '0.4rem', textAlign: 'center'}}>
                        {quickPreviewResult.filename.replace('.json', '')}
                        {' '}<button style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '0.7rem', color: '#aaa', padding: 0}} onClick={() => setQuickPreviewResult(null)}>✕</button>
                      </div>
                      {quickPreviewResult.error ? (
                        <div style={{color: '#dc2626', fontSize: '0.75rem'}}>Error: {quickPreviewResult.error}</div>
                      ) : (
                        <div className="preview-grid">
                          <div>
                            <div className="preview-label">Detailed</div>
                            <div className="preview-bubble">{quickPreviewResult.detailed}</div>
                          </div>
                          <div>
                            <div className="preview-label">Short</div>
                            <div className="preview-bubble">{quickPreviewResult.short}</div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                  {chartData.length > 0 && (
                    <div style={{marginTop: '1.25rem', textAlign: 'center', maxWidth: '100%'}}>
                      <div style={{fontSize: '0.7rem', color: '#888', marginBottom: '0.5rem', display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '0.5rem'}}>
                        {chartsFile.replace('.json', '')} — Charts
                        {' '}<button style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '0.7rem', color: '#aaa', padding: 0}} onClick={() => setChartData([])}>✕</button>
                      </div>
                      {chartData[0].error ? (
                        <div style={{color: '#dc2626', fontSize: '0.75rem'}}>Error: {chartData[0].error}</div>
                      ) : (
                        <React.Fragment>
                          <div style={{display: 'flex', justifyContent: 'center', gap: '0.4rem', marginBottom: '0.4rem'}}>
                            {[{label: '7D', value: 7}, {label: '30D', value: 30}, {label: 'All', value: 'all'}].map(opt => (
                              <button key={opt.label}
                                className={`btn ${String(chartsDays) === String(opt.value) ? 'btn-primary' : 'btn-secondary'}`}
                                style={{padding: '0.25rem 0.7rem', fontSize: '0.75rem'}}
                                disabled={chartsLoading}
                                onClick={() => loadCharts(chartsFile, opt.value)}>
                                {opt.label}
                              </button>
                            ))}
                          </div>
                          <div style={{display: 'flex', justifyContent: 'center', gap: '0.4rem', marginBottom: '0.4rem'}}>
                            {[{label: '% Change', value: 'percent'}, {label: '$ Change', value: 'dollar'}].map(opt => (
                              <button key={opt.label}
                                className={`btn ${chartsMode === opt.value ? 'btn-primary' : 'btn-secondary'}`}
                                style={{padding: '0.25rem 0.7rem', fontSize: '0.75rem'}}
                                onClick={() => setChartsMode(opt.value)}>
                                {opt.label}
                              </button>
                            ))}
                          </div>
                          {chartData[0].history && (
                            <div style={{fontSize: '0.7rem', color: '#999', marginBottom: '0.8rem'}}>
                              {formatDateRangeLabel(chartData[0].history)}
                            </div>
                          )}
                          <div style={{display: 'flex', flexDirection: 'column', gap: '1.5rem', alignItems: 'center'}}>
                            {chartData.map((chart) => (
                              <div key={chart.name} style={{position: 'relative', width: '100%', maxWidth: '800px', border: '1px solid #ddd', borderRadius: '4px', padding: '0.5rem'}}>
                                <button onClick={() => setFullscreenChart(chart)} title="Expand fullscreen" style={{position: 'absolute', top: '0.6rem', right: '0.6rem', zIndex: 1, background: '#fff', border: '1px solid #ddd', borderRadius: '4px', width: '28px', height: '28px', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', fontSize: '0.9rem', color: '#666'}}>⛶</button>
                                <InteractiveChart name={chart.name} currency={chart.currency} history={chart.history} mode={chartsMode} days={chartsDays} />
                              </div>
                            ))}
                          </div>
                        </React.Fragment>
                      )}
                      {fullscreenChart && (
                        <div style={{position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.9)', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', zIndex: 10000, padding: '2rem', overflowY: 'auto'}}>
                          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%', maxWidth: '95vw', marginBottom: '1rem', color: '#fff'}}>
                            <div style={{display: 'flex', alignItems: 'center', gap: '0.75rem'}}>
                              <button onClick={() => navigateFullscreen(-1)} disabled={chartData.length < 2} title="Previous account" style={{background: 'none', border: '1px solid #666', borderRadius: '4px', color: '#fff', fontSize: '1rem', cursor: chartData.length < 2 ? 'default' : 'pointer', opacity: chartData.length < 2 ? 0.4 : 1, width: '28px', height: '28px'}}>‹</button>
                              <span style={{fontSize: '1.2rem', fontWeight: 600}}>{fullscreenChart.name}</span>
                              <button onClick={() => navigateFullscreen(1)} disabled={chartData.length < 2} title="Next account" style={{background: 'none', border: '1px solid #666', borderRadius: '4px', color: '#fff', fontSize: '1rem', cursor: chartData.length < 2 ? 'default' : 'pointer', opacity: chartData.length < 2 ? 0.4 : 1, width: '28px', height: '28px'}}>›</button>
                            </div>
                            <button onClick={() => setFullscreenChart(null)} style={{background: 'none', border: 'none', color: '#fff', fontSize: '2rem', cursor: 'pointer', padding: 0}}>&times;</button>
                          </div>
                          <div style={{display: 'flex', justifyContent: 'center', gap: '0.4rem', marginBottom: '0.4rem'}}>
                            {[{label: '7D', value: 7}, {label: '30D', value: 30}, {label: 'All', value: 'all'}].map(opt => (
                              <button key={opt.label}
                                className={`btn ${String(chartsDays) === String(opt.value) ? 'btn-primary' : 'btn-secondary'}`}
                                style={{padding: '0.25rem 0.7rem', fontSize: '0.75rem'}}
                                disabled={chartsLoading}
                                onClick={() => loadCharts(chartsFile, opt.value)}>
                                {opt.label}
                              </button>
                            ))}
                          </div>
                          <div style={{display: 'flex', justifyContent: 'center', gap: '0.4rem', marginBottom: '1rem'}}>
                            {[{label: '% Change', value: 'percent'}, {label: '$ Change', value: 'dollar'}].map(opt => (
                              <button key={opt.label}
                                className={`btn ${chartsMode === opt.value ? 'btn-primary' : 'btn-secondary'}`}
                                style={{padding: '0.25rem 0.7rem', fontSize: '0.75rem'}}
                                onClick={() => setChartsMode(opt.value)}>
                                {opt.label}
                              </button>
                            ))}
                          </div>
                          <div style={{background: '#fff', borderRadius: '4px', padding: '1rem', width: 'min(1150px, 95vw)'}}>
                            <InteractiveChart name={fullscreenChart.name} currency={fullscreenChart.currency} history={fullscreenChart.history} mode={chartsMode} days={chartsDays} width={1100} height={fullscreenChartHeight} />
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ) : (
                <div>
                  <p>No reports found. Create a new report or open a JSON file.</p>
                  <div className="row" style={{marginTop: '0.75rem'}}>
                    <button className="btn btn-primary" onClick={newConfig}>New Report</button>
                    <button className="btn btn-secondary" onClick={loadJSON}>Open JSON</button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      // ── FORM ─────────────────────────────────────────────────────────
      const { weekdaysOnly, hours } = parseSchedulesToGrid(config.schedules);

      return (
        <div className="app">
          <div className="sticky-header">
            {topBar}
            <div className="editor-tabs">
              <button className={`editor-tab-btn${editorTab === 'portfolio' ? ' active' : ''}`} onClick={() => setEditorTab('portfolio')}>Holdings</button>
              <button className={`editor-tab-btn${editorTab === 'strategy' ? ' active' : ''}`} onClick={() => setEditorTab('strategy')}>Strategy</button>
              <button className={`editor-tab-btn${editorTab === 'schedule' ? ' active' : ''}`} onClick={() => setEditorTab('schedule')}>Schedule</button>
              <button className={`editor-tab-btn${editorTab === 'preview' ? ' active' : ''}`} onClick={() => setEditorTab('preview')}>Preview</button>
            </div>
          </div>

          <div style={{paddingTop: '0.75rem'}}>

          {editorTab === 'schedule' && <>

          {/* Report Details */}
          <div className="section">
            <div className="section-header">
              <h2 className="section-title">Report Details</h2>
            </div>
            <div className="row">
              <div className="field">
                <label>Report Name</label>
                <input type="text" value={config.reportName} onChange={(e) => updateConfig('reportName', e.target.value)} placeholder="Daves_report" style={{width: '200px'}} />
              </div>
            </div>
          </div>

          {/* Schedules */}
          <div className="section">
            <div className="section-header">
              <h2 className="section-title">Schedules</h2>
            </div>
            <div className="schedule-days-toggle">
              <label>
                <input type="checkbox" checked={weekdaysOnly} onChange={(e) => setScheduleWeekdays(e.target.checked)} />
                {' '}Weekdays only
              </label>
              <span style={{fontSize: '0.65rem', color: '#666'}}>{weekdaysOnly ? 'Mon–Fri' : 'Every day'}</span>
            </div>
            <div className="schedule-grid">
              {SCHEDULE_HOURS.map(hour => {
                const checked = !!hours[hour];
                const hourFormat = (hours[hour] || {}).format || 'detailed';
                return (
                  <div key={hour} className={`schedule-grid-row${checked ? ' checked' : ''}`}>
                    <input type="checkbox" checked={checked} onChange={() => toggleScheduleHour(hour)} />
                    <label className="hour-label" onClick={() => toggleScheduleHour(hour)}>{HOUR_LABELS[hour]}</label>
                    {checked && (
                      <select value={hourFormat} onChange={(e) => setScheduleHourFormat(hour, e.target.value)}>
                        {FORMAT_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
                      </select>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* Recipients */}
          <div className="section">
            <div className="section-header">
              <h2 className="section-title">Post to ntfy topic:</h2>
              <button className="btn btn-secondary btn-sm" onClick={addRecipient}>+ Add</button>
            </div>
            {config.alertRecipients.map((recipient, idx) => (
              <div key={idx} className="recipient-row">
                <input type="text" value={recipient} onChange={(e) => updateConfig(`alertRecipients.${idx}`, e.target.value)} placeholder="portfolio-dave-a7x29k" />
                <button className="btn btn-danger btn-sm" onClick={() => removeRecipient(idx)}>×</button>
              </div>
            ))}
          </div>

          </>}

          {editorTab === 'portfolio' && <>

          {/* Accounts */}
          <div className="section">
            <div className="section-header">
              <h2 className="section-title">Accounts</h2>
              <div style={{display:'flex',alignItems:'center',gap:'0.75rem'}}>
                <button className="btn btn-secondary btn-sm" onClick={addAccount}>+ Add Account</button>
              </div>
            </div>
            {config.accounts.map((account, accIdx) => (
              <div key={accIdx} className="account-card">
                <div className="account-header">
                  <div style={{display:'flex',alignItems:'center',gap:'0.25rem'}}>
                    <input type="text" value={account.name} onChange={(e) => updateConfig(`accounts.${accIdx}.name`, e.target.value)} onFocus={(e) => e.target.select()} style={{font: 'inherit', fontWeight: 600, fontSize: '0.85rem', border: 'none', background: 'transparent', padding: 0, outline: 'none', minWidth: '60px', width: `${Math.max(60, account.name.length * 8)}px`, maxWidth: '200px'}} />
                    <span style={{fontSize:'0.7rem',color:'#9ca3af',cursor:'text',lineHeight:1}} title="Click to rename" onClick={() => { const el = document.querySelectorAll('.account-header input[type=text]')[accIdx]; el?.focus(); el?.select(); }}>✏️</span>
                  </div>
                  {(() => {
                    const rs = rebalanceState[accIdx];
                    const sym = account.currency === 'USD' ? '$' : 'C$';
                    if (rs?.loading && rs?.accountTotal == null) return <span style={{fontSize: '0.7rem', color: '#aaa'}}>…</span>;
                    if (rs?.accountTotal != null) return <span style={{fontSize: '0.85rem', color: '#111', fontWeight: 400}}>{sym}{Math.round(rs.accountTotal).toLocaleString('en-CA')}</span>;
                    return null;
                  })()}
                  <div style={{display: 'flex', gap: '0.25rem', alignItems: 'center'}}>
                    <button className="btn btn-secondary btn-sm" onClick={() => moveAccount(accIdx, -1)} disabled={accIdx === 0} title="Move up">↑</button>
                    <button className="btn btn-secondary btn-sm" onClick={() => moveAccount(accIdx, 1)} disabled={accIdx === config.accounts.length - 1} title="Move down">↓</button>
                    <button className="btn btn-danger btn-sm" onClick={() => removeAccount(accIdx)}>Remove</button>
                  </div>
                </div>
                <div className="row">
                  <div className="field">
                    <label>Currency</label>
                    <select value={account.currency} onChange={(e) => updateConfig(`accounts.${accIdx}.currency`, e.target.value)} style={{width: '65px'}}>
                      <option value="CAD">CAD</option>
                      <option value="USD">USD</option>
                    </select>
                  </div>
                  <div className="field">
                    <label>Cash</label>
                    <input type="number" value={account.cash} onChange={(e) => updateConfig(`accounts.${accIdx}.cash`, parseFloat(e.target.value) || 0)} onFocus={(e) => e.target.select()} style={{width: '90px'}} />
                  </div>
                </div>
                <div style={{marginTop: '0.35rem'}}>
                  <div className="row" style={{marginBottom: '0.2rem'}}>
                    <label style={{flex: 1}}>Holdings</label>
                    <button className="btn btn-secondary btn-sm" onClick={() => sortHoldings(accIdx)}>A–Z</button>
                  </div>
                  <div className="holding-scroll-wrap">
                    <div className="holding-min-width">
                  {(account.stocks.length > 0 || pendingAdd[accIdx] !== undefined) && (
                    <div className="holding-header">
                      <span className="hh-name">Name</span>
                      <span className="hh-shares">Shares</span>
                      <span className="hh-price">Price</span>
                      <span className="hh-wt">Wt%</span>
                      <span className="hh-targ">Targ%</span>
                      <span className="hh-diff">Diff</span>
                      <span className="hh-action">Action</span>
                      <span className="hh-btn" style={{minWidth:'46px'}}></span>
                    </div>
                  )}
                  {account.stocks.map((stock, stockIdx) => ({stock, stockIdx})).filter(({stock}) => stock.ticker || stock.name).map(({stock, stockIdx}) => {
                    const rs = rebalanceState[accIdx];
                    const hd = rs?.holdings?.[stockIdx];
                    const sym = account.currency === 'USD' ? '$' : 'C$';
                    const raction = rs?.data?.actions?.find(a => a.ticker === stock.ticker);
                    const priceStr = hd?.price != null ? `${sym}${hd.price.toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2})}` : '—';
                    const wtStr = hd?.weight != null ? hd.weight.toFixed(1)+'%' : '—';
                    const targStr = stock.targetWeight != null ? stock.targetWeight.toFixed(1)+'%' : '—';
                    const diff = (stock.targetWeight != null && hd?.weight != null) ? stock.targetWeight - hd.weight : null;
                    const diffStr = diff != null ? (diff >= 0 ? '+' : '') + diff.toFixed(1)+'%' : '—';
                    const diffColor = diff == null ? '#aaa' : Math.abs(diff) < 0.5 ? '#888' : diff > 0 ? '#16a34a' : '#dc2626';
                    // Look up rationale from strategy data
                    const normTk = (t) => t.toUpperCase().replace(/\.(TO|NE|V|TSX)$/i, '');
                    const stratAcct = strategyState?.data?.accounts?.find((a, ai) =>
                      a.accountName === account.name ||
                      a.accountName.toLowerCase().includes(account.name.toLowerCase()) ||
                      account.name.toLowerCase().includes(a.accountName.toLowerCase()) ||
                      ai === accIdx
                    );
                    const rationale = stratAcct?.targets?.find(t => t.ticker === stock.ticker || normTk(t.ticker) === normTk(stock.ticker))?.rationale;
                    let actionText = '', actionColor = '#888';
                    const pendingKey = `${config.reportName}|${account.name}|${stock.ticker}`;
                    const isPending = !!rebalancePending[pendingKey];
                    if (raction) {
                      if (raction.action === 'hold') {
                        actionText = '✓'; actionColor = '#888';
                      } else {
                        const costSym = raction.convFactor ? '$' : sym;
                        const cost = Math.round(raction.convFactor ? raction.deltaCost / raction.convFactor : raction.deltaCost).toLocaleString('en-CA');
                        const orderPart = raction.orderType === 'market' ? ' market ⚡'
                          : raction.limitPrice != null ? ` limit ${costSym}${(raction.convFactor ? raction.limitPrice / raction.convFactor : raction.limitPrice).toFixed(2)}` : '';
                        actionText = `${raction.action} ${raction.deltaShares} (${costSym}${cost})${orderPart}`;
                        actionColor = raction.action === 'buy' ? '#16a34a' : '#dc2626';
                      }
                    } else if (!rs && stock.targetWeight != null) {
                      actionText = 'run rebalance'; actionColor = '#9ca3af';
                    }
                    return (
                      <div key={stockIdx} className="holding-row" style={isPending ? {opacity:0.5} : {}}>
                        <div className="hi-name" style={{display:'flex',flexDirection:'column',justifyContent:'center',gap:'1px'}}>
                          <input type="text" style={{font:'inherit',border:'1px solid #d1d5db',borderRadius:'3px',padding:'0.15rem 0.3rem',width:'100%',boxSizing:'border-box'}} value={stock.ticker || ''} onChange={(e) => { const v = e.target.value; setConfig(prev => { const c = JSON.parse(JSON.stringify(prev)); c.accounts[accIdx].stocks[stockIdx].ticker = v || ''; c.accounts[accIdx].stocks[stockIdx].name = undefined; return c; }); setPreviewResult(null); }} placeholder="Ticker" />
                        </div>
                        <input className="hi-shares" type="text" inputMode="decimal" key={`shares-${accIdx}-${stockIdx}-${stock.shares}`} defaultValue={stock.shares} onBlur={(e) => { const val = parseFloat(e.target.value); updateConfig(`accounts.${accIdx}.stocks.${stockIdx}.shares`, isNaN(val) ? 0 : val); }} />
                        {hd?.lookupFailed && stock.shares > 0 ? (
                          <input className="hi-stat hi-price" type="text" inputMode="decimal"
                            style={{border: '1px solid #f5c542', borderRadius: '3px', textAlign: 'right', padding: '0.1rem 0.2rem', boxSizing: 'border-box'}}
                            key={`manualprice-${accIdx}-${stockIdx}-${stock.manualPrice}`}
                            defaultValue={stock.manualPrice ?? ''}
                            placeholder="price?"
                            title="Yahoo can't find this ticker — enter its price manually (e.g. from your statement)"
                            onBlur={(e) => { const val = parseFloat(e.target.value); updateConfig(`accounts.${accIdx}.stocks.${stockIdx}.manualPrice`, isNaN(val) ? undefined : val); }} />
                        ) : (
                          <span className="hi-stat hi-price" title="Current price in account currency">{priceStr}</span>
                        )}
                        <span className="hi-stat hi-wt" title="Current portfolio weight">{wtStr}</span>
                        <span className="hi-targ">
                          <button className="hi-adj" onClick={() => adjustTargetWeight(accIdx, stockIdx, -1)} disabled={stock.targetWeight == null}>−</button>
                          <span style={{flex:1,textAlign:'center',fontSize:'0.7rem',color:'#555'}}>{targStr}</span>
                          <button className="hi-adj" onClick={() => adjustTargetWeight(accIdx, stockIdx, +1)} disabled={stock.targetWeight == null}>+</button>
                        </span>
                        <span className="hi-stat hi-diff" style={{color:diffColor}} title="Target − current weight">{diffStr}</span>
                        <span className="hi-action" style={{color: isPending ? '#aaa' : actionColor}} title={actionText}>
                          {raction && raction.action !== 'hold' && (
                            <input type="checkbox" checked={isPending} onChange={() => setRebalancePending(p => ({...p, [pendingKey]: !p[pendingKey]}))} title="Mark order placed" style={{marginRight:'0.25rem',verticalAlign:'middle'}} />
                          )}
                          {actionText}
                        </span>
                        {rationale && <button className="hi-info" style={{flexShrink:0}} onClick={() => setRationalePopup({ticker: stock.name || stock.ticker, rationale})} title="Strategy rationale">ⓘ</button>}
                        <button className="btn btn-danger btn-sm" style={{flexShrink:0}} onClick={() => removeHolding(accIdx, stockIdx)}>×</button>
                      </div>
                    );
                  })}
                  {pendingAdd[accIdx] !== undefined && (
                    <div className="holding-row" style={{borderLeftColor: '#10b981'}}>

          <div className="section">
            <div className="section-header">
              <h2 className="section-title">Preview & Test{config.alertRecipients.length > 0 && ` — post to ntfy: ${config.alertRecipients.join(', ')}`}</h2>
            </div>

            {/* Run buttons */}
            <div style={{display: 'flex', gap: '0.5rem', alignItems: 'center', marginBottom: '0.5rem', flexWrap: 'wrap'}}>
              <select value={previewFormatMode} onChange={(e) => setPreviewFormatMode(e.target.value)} style={{fontSize: '0.75rem'}} title="Report format">
                {FORMAT_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
              </select>
              <button className="btn btn-primary" onClick={runPreview} disabled={previewLoading || smsLoading}>
                {previewLoading ? 'Fetching…' : 'Show preview'}
              </button>
              <button className="btn btn-danger" onClick={runSMS} disabled={previewLoading || smsLoading || config.alertRecipients.length === 0}>
                {smsLoading ? 'Posting…' : `Post to ntfy${config.alertRecipients.length > 0 ? ': ' + config.alertRecipients.join(', ') : ''}`}
              </button>
              {!smsResult && <span style={{fontSize: '0.65rem', color: '#888'}}>Fetches live prices via Yahoo, no message sent</span>}
              {smsResult && smsResult.ok && <span style={{fontSize: '0.65rem', color: '#16a34a'}}>✓ Posted to ntfy</span>}
              {smsResult && smsResult.error && <span style={{fontSize: '0.65rem', color: '#dc2626'}}>✗ {smsResult.error}</span>}
            </div>

            {/* Result — two bubbles side by side, or single bubble for rebalance */}
            {previewResult && previewResult.charts && (
              <div>
                <div className="preview-label">Charts</div>
                <div style={{display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: '1rem', alignItems: 'start'}}>
                  {previewResult.charts.map((chart, idx) => (
                    <div key={idx} style={{textAlign: 'center'}}>
                      <div style={{fontSize: '0.75rem', color: '#666', marginBottom: '0.5rem', fontWeight: '500'}}>{chart.name}</div>
                      {chart.error ? (
                        <div style={{color: '#dc2626', fontSize: '0.75rem'}}>Error: {chart.error}</div>
                      ) : (
                        <img src={chart.url} alt={`${chart.name} chart`} style={{maxWidth: '100%', maxHeight: '400px', border: '1px solid #ddd', borderRadius: '4px'}} />
                      )}
                    </div>
                  ))}
                </div>
              </div>
            )}
            {previewResult && (previewResult.detailed || previewResult.short) && !previewResult.charts && (
              <div className="preview-grid">
                <div>
                  <div className="preview-label">Detailed</div>
                  <div className="preview-bubble">{previewResult.detailed}</div>
                </div>
                <div>
                  <div className="preview-label">Short</div>
                  <div className="preview-bubble">{previewResult.short}</div>
                </div>
              </div>
            )}
            {previewResult && previewResult.text && (
              <div>
                <div className="preview-label">Sheet debug output</div>
                <div className="preview-bubble" style={{fontFamily: 'monospace', fontSize: '0.7rem', whiteSpace: 'pre'}}>{previewResult.text}</div>
              </div>
            )}
            {previewResult && previewResult.error && (
              <div style={{fontSize: '0.75rem', color: '#dc2626'}}>
                Error: {previewResult.error}
              </div>
            )}
          </div>

          </>}

          {/* Rationale popup */}
          {rationalePopup && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1100}} onClick={() => setRationalePopup(null)}>
              <div style={{background:'#fff',borderRadius:'8px',padding:'1.25rem',maxWidth:'480px',width:'90%',boxShadow:'0 8px 32px rgba(0,0,0,0.2)'}} onClick={e => e.stopPropagation()}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.75rem'}}>
                  <strong style={{fontSize:'0.9rem'}}>{rationalePopup.ticker} — Strategy Rationale</strong>
                  <button className="btn btn-secondary btn-sm" onClick={() => setRationalePopup(null)}>Close</button>
                </div>
                <p style={{fontSize:'0.82rem',lineHeight:1.55,color:'#374151',margin:0}}>{rationalePopup.rationale}</p>
              </div>
            </div>
          )}

          {/* Claude modal fallback */}
          {claudeModalText && (
            <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}} onClick={() => setClaudeModalText(null)}>
              <div style={{background:'#fff',borderRadius:'8px',padding:'1.25rem',maxWidth:'640px',width:'90%',boxShadow:'0 8px 32px rgba(0,0,0,0.2)'}} onClick={e => e.stopPropagation()}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.6rem'}}>
                  <strong style={{fontSize:'0.9rem'}}>Copy for Claude</strong>
                  <button className="btn btn-secondary btn-sm" onClick={() => setClaudeModalText(null)}>Close</button>
                </div>
                <p style={{fontSize:'0.7rem',color:'#666',marginBottom:'0.5rem'}}>Select all and copy (Cmd+A, Cmd+C), then paste into Claude.</p>
                <textarea
                  readOnly
                  value={claudeModalText}
                  onClick={e => e.target.select()}
                  style={{width:'100%',height:'320px',fontFamily:'monospace',fontSize:'0.72rem',border:'1px solid #ccc',borderRadius:'4px',padding:'0.5rem',resize:'vertical'}}
                />
              </div>
            </div>
          )}
          </div>{/* end paddingTop wrapper */}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>

  <!-- Tab Switching + Schedules Logic -->
  <script>
    function switchTab(tab) {
      document.getElementById('panel-editor').style.display = tab === 'editor' ? '' : 'none';
      document.getElementById('panel-schedules').style.display = tab === 'schedules' ? '' : 'none';
      document.getElementById('tab-btn-editor').classList.toggle('active', tab === 'editor');
      document.getElementById('tab-btn-schedules').classList.toggle('active', tab === 'schedules');
      if (tab === 'schedules') loadSchedules();
    }

    function loadSchedules() {
      fetch('/api/schedules')
        .then(response => response.json())
        .then(schedules => {
          const container = document.getElementById('schedulesContent');
          if (schedules.length === 0) {
            container.innerHTML = '<div class="sched-empty"><div style="font-size: 48px; margin-bottom: 16px;">📅</div><p>No schedules configured yet.</p></div>';
            return;
          }
          const grouped = {};
          for (const s of schedules) {
            if (!grouped[s.reportName]) grouped[s.reportName] = [];
            grouped[s.reportName].push(s);
          }
          for (const slots of Object.values(grouped)) {
            slots.sort((a, b) => {
              const hourA = parseInt(a.cronExpression.split(' ')[1]) || 0;
              const hourB = parseInt(b.cronExpression.split(' ')[1]) || 0;
              return hourA - hourB;
            });
          }
          let html = '';
          for (const [reportName, slots] of Object.entries(grouped)) {
            html += '<div class="sched-report-card"><div class="sched-report-name">' + reportName + '</div><table><thead><tr><th>Time</th><th>Format</th><th>Last</th></tr></thead><tbody>';
            for (const slot of slots) {
              html += '<tr><td>' + slot.schedule + '</td><td>' + slot.format + '</td><td>' + formatLastRun(slot.lastRun) + '</td></tr>';
            }
            html += '</tbody></table></div>';
          }
          container.innerHTML = html;
        })
        .catch(error => {
          document.getElementById('schedulesContent').innerHTML = '<div class="sched-empty"><p style="color: #dc3545;">Error: ' + error.message + '</p></div>';
        });
    }

    function formatLastRun(lastRun) {
      if (!lastRun) return '<span style="color:#bbb;">—</span>';
      return '<span class="sched-timestamp">' + formatTimestamp(lastRun).replace(' ago', '') + '</span>';
    }

    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return diffMins + 'm ago';
      if (diffHours < 24) return diffHours + 'h ago';
      if (diffDays < 7) return diffDays + 'd ago';
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
    }

    function runReportNow(reportName, format) {
      fetch('/api/reports')
        .then(response => response.json())
        .then(reports => {
          const report = reports.find(r => r.reportName === reportName);
          if (!report) { alert('Report not found'); return; }
          return fetch('/api/reports/' + report.filename + '/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ format: format })
          }).then(r => r.json()).then(result => {
            if (result.success) {
              alert('Report "' + reportName + '" is running. SMS will be sent when complete.');
              setTimeout(loadSchedules, 2000);
            } else {
              alert('Error running report: ' + (result.error || 'Unknown error'));
            }
          });
        })
        .catch(error => {
          alert('Error: ' + error.message);
        });
    }

    setInterval(() => {
      if (document.getElementById('panel-schedules').style.display !== 'none') {
        loadSchedules();
      }
    }, 30000);
  </script>
</body>
